name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # oldest = documented minimum; 3.10 is EOL (Oct 2026)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            examples/pytest/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r examples/pytest/requirements.txt

      - name: Validate skill package (Agent Skills spec + portability)
        run: python tools/validate_skill.py skills/intelligent-qa-engineer

      - name: Scan for secrets
        run: python tools/scan_secrets.py

      - name: Validate example deliverables
        run: |
          python skills/intelligent-qa-engineer/scripts/validate_test_cases.py \
            examples/user-story/test-cases.csv --traceability examples/user-story/traceability-matrix.csv --strict
          python skills/intelligent-qa-engineer/scripts/validate_test_cases.py \
            examples/openapi/test-cases.csv --traceability examples/openapi/traceability-matrix.csv --strict

      - name: Repository tests
        run: python -m pytest --junitxml=reports/repo-junit.xml

      - name: pytest example against local mock
        run: python -m pytest examples/pytest --junitxml=reports/example-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-${{ matrix.python-version }}
          path: reports/

  newman:
    name: Postman collection via Newman (local mock)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Newman
        run: npm install -g newman@6

      - name: Run collection
        env:
          REPORT_DIR: ${{ github.workspace }}/reports
        run: examples/postman/run-local.sh 8000

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-junit
          path: reports/

  package:
    name: Package skill
    runs-on: ubuntu-24.04
    needs: [validate]
    steps:
      - uses: actions/checkout@v7

      - name: Build zip (folder at zip root)
        run: |
          mkdir -p dist
          cd skills && zip -r ../dist/intelligent-qa-engineer.zip intelligent-qa-engineer -x '*/__pycache__/*'

      - uses: actions/upload-artifact@v7
        with:
          name: intelligent-qa-engineer-skill
          path: dist/intelligent-qa-engineer.zip
