version: 2
updates:
  # Keeps the actions in .github/workflows on current majors (e.g. Node runtime moves).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /
      - /examples/pytest
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
