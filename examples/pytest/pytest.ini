[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: fast go/no-go checks safe for any authorized environment
    negative: invalid input, auth and state scenarios
    contract: response status/schema checks against the OpenAPI contract
    destructive: deletes or irreversibly changes data (skipped on remote targets unless ALLOW_DESTRUCTIVE_TESTS=1)
    concurrency: sends parallel requests
